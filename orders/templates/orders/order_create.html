{% extends '_base.html' %}

{% block title %}

{% endblock %}

{% block body %}
  <!-- Checkout -->
  <section class="pt-5 mt-5">
    <div class="container">
      <h1 class="fw-bold mb-4">تسویه حساب</h1>

      <div class="row gy-4">
        <!-- User Info -->
        <div class="col-lg-7">
          <div class="glass-card p-4">
            <h5 class="fw-bold mb-4">اطلاعات خریدار</h5>

            <div class="row gy-3">
              <div class="col-md-6">
                <label class="form-label">نام و نام خانوادگی</label>
                <input type="text" class="form-control checkout-input" />
              </div>

              <div class="col-md-6">
                <label class="form-label">شماره تماس</label>
                <input type="tel" class="form-control checkout-input" />
              </div>

              <div class="col-12">
                <label class="form-label">ایمیل (اختیاری)</label>
                <input type="email" class="form-control checkout-input" />
              </div>

              <div class="col-12">
                <label class="form-label">آدرس کامل</label>
                <textarea rows="3" class="form-control checkout-input"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="col-lg-5">
          <div class="glass-card p-4 checkout-summary">
            <h5 class="fw-bold mb-4">خلاصه سفارش</h5>

            <div class="d-flex justify-content-between mb-2">
              <span>جمع سبد خرید</span>
              <span class="fw-bold">7,400,000 تومان</span>
            </div>

            <div class="d-flex justify-content-between mb-2">
              <span>تخفیف</span>
              <span class="fw-bold text-success">-1,480,000 تومان</span>
            </div>

            <div class="d-flex justify-content-between mb-3">
              <span>هزینه ارسال</span>
              <span class="fw-bold">رایگان</span>
            </div>

            <hr class="opacity-25" />

            <div class="d-flex justify-content-between fs-5">
              <span>مبلغ نهایی</span>
              <span class="fw-bold final-price">5,920,000 تومان</span>
            </div>

            <!-- Payment -->
            <div class="mt-4">
              <h6 class="fw-bold mb-3">روش پرداخت</h6>

              <div class="d-flex flex-column gap-2 payment-methods">
                <label class="glass-radio active"><input type="radio" name="payment" checked />پرداخت آنلاین</label>

                <label class="glass-radio"><input type="radio" name="payment" />ثبت سفارش و تماس</label>
              </div>
            </div>

            <button class="btn btn-glass w-100 mt-4">ثبت سفارش</button>
          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
