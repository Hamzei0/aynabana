{% extends '_base.html' %}

{% block title %}
  login
{% endblock %}

{% block body %}
  <!-- Auth Page -->
  <section class="pt-5 mt-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="glass-card p-5 auth-box">
            <!-- Tabs -->
            <div class="d-flex justify-content-center mb-4 auth-tabs">
              <a href="{% url 'account_login' %}" class="auth-tab active" data-target="login">ورود</a>
              <a href="{% url 'account_signup' %}" class="auth-tab" data-target="signup">ثبت‌نام</a>
            </div>

            <!-- Login -->
            <div class="auth-form login-form">
              <h4 class="fw-bold mb-4 text-center">ورود به حساب کاربری</h4>

              <form action="{% url 'account_login' %}" method="post">
                {% csrf_token %}
                <div class="mb-3">
                  <label class="form-label">ایمیل | نام کاربری</label>
                  <input name="login" type="text" class="form-control glass-input" required />
                </div>

                <div class="mb-3">
                  <label class="form-label">رمز عبور</label>
                  <input name="password" type="password" class="form-control glass-input" required />
                </div>
                <div class="form-check mb-3">
                  <input name="remember" class="form-check-input" type="checkbox" id="rememberMe" />
                  <label class="form-check-label opacity-75" for="rememberMe">مرا به خاطر بسپار</label>
                </div>

                <button type="submit" class="btn btn-glass w-100 mt-3">ورود</button>

                <div class="text-center mt-3 opacity-75 small">رمز عبور را فراموش کرده‌اید؟</div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
